<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Healthcare Diagnosis System</title>

    <!-- Link to Google Fonts for better font styles -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Set a full-screen background using the image stored in static/images */
        body {
            margin: 0;
            height: 100vh;
            background: url('/static/images/your_image_name.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Roboto', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Center the content */
        .content {
            text-align: center;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.7); /* Dark transparent background */
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            width: 80%;
            max-width: 600px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: 2px solid #ccc;
            font-size: 1rem;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #FF5733;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #c14424;
        }

        .result {
            font-size: 1.5rem;
            margin-top: 20px;
        }

        .score {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>AI Healthcare Diagnosis System</h1>

        <!-- Form for user to enter symptoms -->
        <form action="/" method="post">
            <label for="symptoms">Enter Symptoms (e.g., fever, cough, headache):</label>
            <input type="text" id="symptoms" name="symptoms" required>
            <button type="submit">Diagnose</button>
        </form>

        <!-- Display results if any -->
        {% if predicted_disease %}
            <h2>Diagnosis Result:</h2>
            <p><strong>Symptoms:</strong> {{ symptoms }}</p>
            <p class="result"><strong>Predicted Disease:</strong> {{ predicted_disease }}</p>
            <p class="result"><strong>Confidence Score:</strong> {{ confidence_score }}%</p>
        {% endif %}
    </div>

</body>
</html>
